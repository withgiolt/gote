name = "server"
version = "1.0.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
mist = ">= 6.0.3 and < 7.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
shared = { path = "../shared" }

[dev_dependencies]
giolt = ">= 0.8.0 and < 1.0.0"

[tools.giolt]
project = 19
# Before every `giolt build` and `giolt dev`: Lustre's build tool bundles the
# client and copies client/assets into priv/static/assets, then
# server/prerender writes priv/static/prerendered.html.
prebuild = "cd ../client && gleam run -m lustre/dev build && cd ../server && gleam run -m server/prerender"
assets = "priv/static"
watch = ["src", "../shared/src", "../client/src", "../client/assets"]
