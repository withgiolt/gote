name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
          rebar3-version: "3.28"

      - name: Cache Gleam builds
        uses: actions/cache@v4
        with:
          path: |
            server/build
            client/build
            client/.lustre
          key: ${{ runner.os }}-gleam-${{ hashFiles('*/manifest.toml', '*/gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-

      # The prebuild in server/gleam.toml builds the client and prerenders
      # before giolt compiles the server and uploads dist/.
      - name: Build & Deploy
        run: gleam run -m giolt deploy
        env:
          GIOLT_TOKEN: ${{ secrets.GIOLT_TOKEN }}
