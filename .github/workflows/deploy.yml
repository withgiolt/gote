name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
          rebar3-version: "3.28"

      - name: Cache Gleam build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-gleam-build-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-build-

      - name: Install dependencies
        run: |
          gleam deps download

      - name: Build & Deploy
        run: gleam run -m giolt deploy
        env:
          GIOLT_TOKEN: ${{ secrets.GIOLT_TOKEN }}
