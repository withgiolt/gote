name = "client"
version = "1.0.0"
target = "javascript"

# The browser bundle. Depends on shared, never on server.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
shared = { path = "../shared" }

[dev_dependencies]
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"

# `gleam run -m lustre/dev build` bundles src/client.gleam to client.js and
# copies assets/ next to it, where the server serves them.
[tools.lustre.build]
outdir = "../server/priv/static/assets"
minify = true
no_html = true
